name: Précalcul indices pollen

on:
  schedule:
    # 14h UTC = 16h Paris (été) / 15h Paris (hiver) — après la fenêtre de
    # rafraîchissement Atmo France (13h-15h heure française)
    - cron: '0 14 * * *'
  workflow_dispatch: {} # permet de déclencher manuellement depuis l'onglet Actions

# Nécessaire pour que l'étape de commit automatique puisse pousser ses
# changements : sur de nombreux dépôts, le jeton par défaut est restreint
# en lecture seule, ce qui ferait échouer cette étape sans ce réglage.
permissions:
  contents: write

jobs:
  fetch-pollen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Récupérer et découper les données pollen
        run: node scripts/fetch-pollen.js
        env:
          ATMO_LOGIN: ${{ secrets.ATMO_LOGIN }}
          ATMO_PASSWORD: ${{ secrets.ATMO_PASSWORD }}

      - name: Committer les fichiers générés
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: mise à jour quotidienne des indices pollen'
          file_pattern: 'data/communes/*.json'

      # jsDelivr met en cache les fichiers servis via "@main" pendant 12h : sans
      # cette étape, l'application continuerait à recevoir les anciennes données
      # pendant ce délai après chaque mise à jour quotidienne.
      - name: Purger le cache jsDelivr
        run: |
          for f in data/communes/*.json; do
            curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/${f}" > /dev/null
            sleep 0.2
          done
        shell: bash
